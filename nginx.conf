server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index Roadbook.html;

    location / {
        try_files $uri $uri/ /Roadbook.html;
    }

    # serve .jsx files as JavaScript so the browser fetches them correctly
    location ~* \.jsx$ {
        default_type text/javascript;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # cache static assets but not the HTML entry point
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /Roadbook.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript;
    gzip_min_length 1024;
}
